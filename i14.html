<style>
    #overlay>path {
        fill: transparent;
        stroke: red;
        pointer-events: auto;
    }
</style>
<script type="module">
    import { addPolyfill } from './getBoxQuads.js';
    addPolyfill();

    const overlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    overlay.setAttribute("id", "overlay");
    overlay.style.position = 'absolute';
    overlay.style.left = '0px';
    overlay.style.top = '0px';
    overlay.style.overflow = 'visible';
    document.body.appendChild(overlay);

    function draw() {
        console.time('boxQ');
        let lst = []
        let i = 0;

        const all = Array.from(document.body.querySelectorAll('path'));
        for (let e of all) {
            const p = e.getBoxQuads({ box: 'border', relativeTo: document.body })[0];
            if (p) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const d = "M" + [p.p1, p.p2, p.p3, p.p4].map(x => x.x + ',' + x.y).join(' ') + 'Z ';
                path.setAttribute("d", d);
                path.setAttribute("id", (e.id ? e.id : i++));
                lst.push(path);
                //overlay.appendChild(path);
            }
        }


        console.timeEnd('boxQ');
        for (let p of lst) {
            overlay.appendChild(p);
        }
    }

    draw();

</script>
